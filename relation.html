<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OC Hub - 角色關係圖</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <header class="main-header">
            <div class="brand">
                <h1>OC Hub</h1><span class="subtitle">角色關係網絡</span>
            </div>
            <div class="menu-dropdown-container">
                <button class="menu-btn" onclick="toggleMenu()">選單</button>
                <div id="dropdownMenu" class="dropdown-content">
                    <a href="index.html">角色大廳</a>
                    <a href="matrix.html">雙軸座標圖</a>
                    <a href="relation.html">角色關係圖</a>
                    <a href="radar.html">能力雷達圖</a>
                    <a href="#" onclick="resetToDefaultData()" style="color:#dc3545; border-top:1px solid #eee;">🔄
                        重置為開頁預設值</a>
                </div>
            </div>
        </header>
        <div class="matrix-layout">
            <!-- 控制與內嵌新增列 -->
            <div class="matrix-top-bar"
                style="flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;">
                <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
                    <div class="axis-select-group">
                        <label>標籤篩選：</label>
                        <select id="tagFilterSelect" onchange="filterRelationView()">
                            <option value="ALL">顯示全部角色</option>
                        </select>
                    </div>

                    <!-- 內嵌新增角色區塊 (不使用跳窗) -->
                    <div
                        style="display:flex; align-items:center; gap:6px; background:#fff; padding:4px 8px; border-radius:8px; border:1px solid #ced4da;">
                        <input type="text" id="inlineCharNameInput" placeholder="新角色名稱"
                            style="border:none; outline:none; font-size:13px; width:100px;">
                        <input type="color" id="inlineCharColorInput" value="#4CAF50"
                            style="width:24px; height:24px; border:none; background:none; cursor:pointer;">
                        <button class="btn btn-search" style="padding:3px 10px; font-size:12px;"
                            onclick="addCharacterInline()">＋ 新增角色</button>
                    </div>
                </div>

                <div style="display:flex; gap:8px;">
                    <button id="dragLockBtn" class="btn" onclick="toggleRelationDragLock()">🔓 節點拖移啟用中</button>
                </div>
            </div>

            <!-- 關係圖畫布區塊 (橫向長方形 16:9，強制限制於容器內) -->
            <div class="matrix-section-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                    <h3>關係網絡圖 <span style="font-size:12px; font-weight:normal; color:#6c757d;">(16:9
                            橫向畫布，按住空白處可平移視窗)</span></h3>
                    <div style="display:flex; align-items:center; gap:6px;">
                        <button class="btn" onclick="zoomRelation(0.15)">🔍 放大</button>
                        <button class="btn" onclick="zoomRelation(-0.15)">🔍 縮小</button>
                        <button class="btn" onclick="resetRelationViewTransform()">🎯 重置視窗</button>
                        <span id="zoomLevelText"
                            style="font-size:12px; color:#6c757d; min-width:40px; text-align:right;">100%</span>
                    </div>
                </div>

                <!-- 外層檢視視窗 -->
                <div class="chart-area" id="panViewport"
                    style="width:100%; max-height:550px; aspect-ratio: 16 / 9; position: relative; overflow: hidden; cursor: grab; border: 1px solid #e9ecef; border-radius: 12px; background-color:#fff;">
                    <div class="chart relation-canvas-bg" id="zoomContainer"
                        style="transform-origin: center center; position: absolute; width: 100%; height: 100%; top:0; left:0;">
                        <div id="relationCanvas" style="width: 100%; height: 100%; position: relative;"></div>
                    </div>
                </div>
            </div>

            <!-- 角色代表色全域設定 -->
            <div class="matrix-section-card">
                <h3>角色顏色設定 <span style="font-size:12px; font-weight:normal; color:#6c757d;">(全站座標圖與關係圖同步)</span></h3>
                <div id="characterColorList" style="display:flex; flex-wrap:wrap; gap:12px; margin-top:10px;"></div>
            </div>

            <!-- 建立與編輯關係面板 -->
            <div class="matrix-section-card">
                <h3 id="relationFormTitle">建立/編輯連線關係</h3>
                <input type="hidden" id="editingRelId" value="">

                <div class="relation-form-row" style="margin-bottom: 10px;">
                    <select id="relFromSelect"></select>
                    <input type="text" id="relLabelInput" placeholder="關係名稱 (如: 宿敵/朋友)">
                    <select id="relToSelect"></select>
                </div>

                <div class="relation-form-row">
                    <label style="font-size:12px;">方向/箭頭：
                        <select id="relArrowSelect">
                            <option value="forward">單向 (A ➔ B)</option>
                            <option value="both">雙向 (A ⇄ B)</option>
                            <option value="none">無箭頭 (A ─ B)</option>
                        </select>
                    </label>

                    <label style="font-size:12px;">線條形式：
                        <select id="relStyleSelect">
                            <option value="solid">實線 ───</option>
                            <option value="dashed">虛線 ╌╌╌</option>
                            <option value="dotted">點線 ┈┈┈</option>
                        </select>
                    </label>

                    <label style="font-size:12px;">線條顏色：
                        <input type="color" id="relColorInput" value="#6c757d"
                            style="width:40px; height:28px; padding:0; border:none; cursor:pointer;">
                    </label>

                    <button id="saveRelBtn" class="btn btn-search" onclick="saveRelation()">＋ 建立連線</button>
                    <button id="cancelEditBtn" class="btn" onclick="resetRelationForm()"
                        style="display:none;">取消編輯</button>
                </div>

                <div id="relationList" class="matrix-axis-list" style="margin-top:16px;"></div>
            </div>
        </div>

    </div>
    <script src="shared.js"></script>
    <script src="relation.js"></script>
</body>

</html>
